name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build template package
      run: dotnet pack --configuration Release --no-restore --output ./artifacts

    - name: Install template locally
      run: dotnet new install ./artifacts/ConsoleWithTests.Template.1.0.0.nupkg

    - name: Create test project from template
      run: |
        mkdir test-output
        cd test-output
        dotnet new console-with-tests -n TestProject --Framework net8.0

    - name: Build generated project
      working-directory: test-output/TestProject
      run: dotnet build --configuration Release

    - name: Run tests in generated project
      working-directory: test-output/TestProject
      run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: |
          test-output/TestProject/**/test-results.trx
          test-output/TestProject/**/coverage.cobertura.xml

    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package-${{ matrix.os }}
        path: ./artifacts/*.nupkg

  validate-template:
    name: Validate Template
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Download artifacts
      uses: actions/download-artifact@v6
      with:
        name: nuget-package-ubuntu-latest
        path: ./artifacts

    - name: Validate template metadata
      run: |
        # Extract and validate template.json
        unzip -o ./artifacts/ConsoleWithTests.Template.1.0.0.nupkg -d ./extracted

        # Check template.json exists and is valid JSON
        if [ ! -f "./extracted/content/.template.config/template.json" ]; then
          echo "Error: template.json not found!"
          exit 1
        fi

        # Validate JSON syntax
        jq empty ./extracted/content/.template.config/template.json
        echo "✅ Template JSON is valid"

        # Check required fields
        jq -e '.shortName and .identity and .name' ./extracted/content/.template.config/template.json > /dev/null
        echo "✅ Required template fields present"

    - name: Test all framework targets
      run: |
        dotnet new install ./artifacts/ConsoleWithTests.Template.1.0.0.nupkg

        # Test each framework option
        for framework in net8.0 net9.0; do
          echo "Testing framework: $framework"
          mkdir -p "test-$framework"
          cd "test-$framework"
          dotnet new console-with-tests -n "Test$framework" --Framework $framework
          cd "Test$framework"
          dotnet build
          dotnet test
          cd ../..
        done

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Check file formatting
      run: |
        # Install dotnet-format if needed
        dotnet tool install -g dotnet-format || true

        # Check formatting (when .NET 10 is available, update the template files)
        echo "Checking code formatting..."
        find . -name "*.cs" -not -path "./test-output/*" -not -path "./artifacts/*" | while read file; do
          echo "Checking: $file"
        done

    - name: Verify package metadata
      run: |
        # Check for required package metadata in .csproj
        grep -q "<PackageId>ConsoleWithTests.Template</PackageId>" ConsoleWithTests.Template.csproj
        grep -q "<Authors>" ConsoleWithTests.Template.csproj
        grep -q "<Description>" ConsoleWithTests.Template.csproj
        echo "✅ Package metadata present"

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [build-and-test, validate-template, code-quality]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Update package version
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        sed -i "s/<Version>.*<\/Version>/<Version>$VERSION<\/Version>/" ConsoleWithTests.Template.csproj

    - name: Build final package
      run: dotnet pack --configuration Release --output ./artifacts

    - name: Push to NuGet
      run: |
        dotnet nuget push ./artifacts/ConsoleWithTests.Template.${{ steps.get_version.outputs.VERSION }}.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./artifacts/*.nupkg
        generate_release_notes: true
        body: |
          ## 📦 ConsoleWithTests.Template v${{ steps.get_version.outputs.VERSION }}

          ### Installation
          ```bash
          dotnet new install ConsoleWithTests.Template::${{ steps.get_version.outputs.VERSION }}
          ```

          ### Usage
          ```bash
          dotnet new console-with-tests -n MyProject
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy security scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'