name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for versioning

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Display .NET info
      run: dotnet --info

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install template from source
      run: dotnet new install .

    - name: Test template with .NET 8
      run: |
        mkdir test-net8
        cd test-net8
        dotnet new console-with-tests -n TestNet8 --Framework net8.0
        cd TestNet8
        dotnet restore --verbosity normal
        dotnet build --configuration ${{ matrix.configuration }} --no-restore --verbosity normal
        dotnet test --configuration ${{ matrix.configuration }} --no-build --verbosity normal \
          --logger trx --logger "console;verbosity=detailed" \
          --collect:"XPlat Code Coverage" --results-directory TestResults

    - name: Test template with .NET 9
      run: |
        mkdir test-net9
        cd test-net9
        dotnet new console-with-tests -n TestNet9 --Framework net9.0
        cd TestNet9
        dotnet restore --verbosity normal
        dotnet build --configuration ${{ matrix.configuration }} --no-restore --verbosity normal
        dotnet test --configuration ${{ matrix.configuration }} --no-build --verbosity normal \
          --logger trx --logger "console;verbosity=detailed" \
          --collect:"XPlat Code Coverage" --results-directory TestResults

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.configuration }}
        path: |
          test-net8/TestNet8/TestResults/
          test-net9/TestNet9/TestResults/

    - name: Upload code coverage
      uses: codecov/codecov-action@v4
      if: matrix.configuration == 'Release'
      with:
        files: |
          test-net8/TestNet8/TestResults/*/coverage.cobertura.xml
          test-net9/TestNet9/TestResults/*/coverage.cobertura.xml
        fail_ci_if_error: false
        verbose: true

  validate-template:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Validate template metadata
      run: |
        # Check template.json exists and is valid JSON
        if [ ! -f ".template.config/template.json" ]; then
          echo "Error: template.json not found!"
          exit 1
        fi

        # Validate JSON syntax
        jq empty .template.config/template.json
        echo "✅ Template JSON is valid"

        # Check required fields
        jq -e '.shortName and .identity and .name' .template.config/template.json > /dev/null
        echo "✅ Required template fields present"

    - name: Verify template structure
      run: |
        # Check for required template files
        [ -f ".template.config/template.json" ] && echo "✅ template.json present"
        [ -f "ProjectName.sln" ] && echo "✅ Solution file present"
        [ -f "src/App/App.csproj" ] && echo "✅ Console app project present"
        [ -f "tests/App.Tests/App.Tests.csproj" ] && echo "✅ Test project present"
        [ -f "console-with-tests.csproj" ] && echo "✅ NuGet package project present"

  package:
    runs-on: ubuntu-latest
    needs: [build-and-test, validate-template]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v') || startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Extract version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          VERSION="1.0.${{ github.run_number }}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Version set to: $VERSION"

    - name: Update .csproj with Version
      run: |
        sed -i "s|<PackageVersion>.*</PackageVersion>|<PackageVersion>${{ env.VERSION }}</PackageVersion>|" console-with-tests.csproj
        echo "Updated version in .csproj to: ${{ env.VERSION }}"

    - name: Clean build outputs
      run: |
        cd src/App && dotnet clean && cd ../..
        cd tests/App.Tests && dotnet clean && cd ../..

    - name: Create NuGet package
      run: dotnet pack console-with-tests.csproj --configuration Release --output ./artifacts

    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg

    - name: Publish to NuGet (on tag or main branch)
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install template
      run: dotnet new install .

    - name: Create test project
      run: |
        mkdir security-test
        cd security-test
        dotnet new console-with-tests -n SecurityTest
        cd SecurityTest

    - name: Restore dependencies
      working-directory: security-test/SecurityTest
      run: dotnet restore

    - name: Run security scan
      working-directory: security-test/SecurityTest
      run: |
        echo "Checking for vulnerable packages..."
        dotnet list package --vulnerable --include-transitive || true
        echo ""
        echo "Checking for deprecated packages..."
        dotnet list package --deprecated || true

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Download NuGet package
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        files: ./artifacts/*.nupkg
        body: |
          ## 📦 console-with-tests v${{ steps.get_version.outputs.VERSION }}

          ### Installation Options

          #### From NuGet.org (Recommended)
          ```bash
          dotnet new install console-with-tests
          ```

          #### From GitHub Release
          ```bash
          dotnet new install mrviduus/ConsoleWithTests.Template::v${{ steps.get_version.outputs.VERSION }}
          ```

          #### From Local Clone
          ```bash
          git clone https://github.com/mrviduus/ConsoleWithTests.Template.git
          dotnet new install ./ConsoleWithTests.Template
          ```

          ### Usage
          ```bash
          dotnet new console-with-tests -n MyProject
          ```

          ### What's in this template
          - Console application with sample code
          - xUnit v3 test project with examples
          - Solution file linking both projects
          - Support for .NET 8, 9, and 10

          ### NuGet Package
          View on NuGet.org: https://www.nuget.org/packages/console-with-tests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}